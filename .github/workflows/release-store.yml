name: Release store image

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/adammiribyan/wide-events-store

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      # The generated Kamal accessory pins
      # ghcr.io/adammiribyan/wide-events-store:<WideEvent::VERSION>, so an
      # image published under any other tag would be unreachable from a
      # freshly generated deploy.yml. Refuse to publish unless the tag, the
      # gem's version constant, and that generated pin are the same string.
      - name: Verify the tag matches the gem version and the generated image pin
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          script/verify-release-version "$TAG"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags, both immutable: the exact semver the generated accessory
      # pins (no leading "v" - that is the tag's spelling, not the gem's),
      # and the Git SHA it was built from. No `latest` - a moving tag would
      # silently change what an already-deployed accessory pulls on its next
      # boot.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: store/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
