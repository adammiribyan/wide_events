name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    env:
      BUNDLE_ONLY: rubocop
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop --parallel
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4", "4.0" ]
        gemfile: [ rails_7_1, rails_7_2, rails_8_0, rails_8_1, rails_main ]
        exclude:
          - ruby: "3.2"
            gemfile: rails_main
          - ruby: "3.3"
            gemfile: rails_main
          - ruby: "4.0"
            gemfile: rails_7_1
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
  store-go:
    name: Store Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: store/go.mod
          cache-dependency-path: store/go.sum
      - name: Test and vet store
        run: |
          cd store
          go test ./...
          go vet ./...
      - name: Check generated formatting
        run: |
          cd store
          gofmt -w .
          cd ..
          git diff --exit-code
  store-integration:
    name: Store integration
    runs-on: ubuntu-latest
    needs: [ tests, store-go ]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: store/go.mod
          cache-dependency-path: store/go.sum
      # The harness compiles its own binary with the deterministic-disk build
      # tag; this proves the production build works too, and warms the cache
      # so the harness build is cheap.
      - name: Build the store binary
        run: cd store && go build -o /dev/null ./cmd/wide-events
      - name: Cross-runtime integration tests
        run: bundle exec ruby -Itest -e 'Dir["test/integration/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
  kamal-config:
    name: Kamal config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kamal: "2.10.0"
            expectation: success
          - kamal: "2.12.0"
            expectation: success
          - kamal: "2.9.0"
            expectation: failure
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false
      - run: script/test-kamal-config ${{ matrix.kamal }} ${{ matrix.expectation }}
  gem-package:
    name: Gem package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build the gem and check its contents
        run: script/check-gem-contents
  store-image:
    name: Store image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: store/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=0.0.0-${{ github.sha }}
